spring.application.name=ecomoda
# Puerto de desarrollo sin privilegios de administrador.
server.port=8080

logging.pattern.dateformat=hh:mm
spring.main.banner-mode=off
spring.thymeleaf.cache=false

# Conexión local por defecto, sin contraseñas incluidas.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecomoda}
spring.datasource.username=${DB_USER:ecomoda_dev}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Los cambios de esquema se realizan con los scripts SQL del equipo.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
# No registrar parámetros que puedan contener datos personales o contraseñas.
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=OFF

prendas.imagenes.directorio=${PRENDAS_IMAGENES_DIRECTORIO:uploads/prendas}
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB
