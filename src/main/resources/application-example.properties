# Plantilla sin secretos. Copiar como application-local.properties y activar
# el perfil local con --spring.profiles.active=local. El archivo local se ignora.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecomoda}
spring.datasource.username=${DB_USER:ecomoda_dev}
spring.datasource.password=${DB_PASSWORD:}

# Firebase es opcional. Usar un JSON externo al proyecto, nunca en el classpath.
firebase.enabled=${FIREBASE_ENABLED:false}
firebase.bucket.name=${FIREBASE_BUCKET_NAME:}
firebase.storage.path=${FIREBASE_STORAGE_PATH:imagenes}
firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}
