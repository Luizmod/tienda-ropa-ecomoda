<!DOCTYPE html>
<html lang="es" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{usuario/fragmentos :: head}"></head>
<body>
<header th:replace="~{general/fragmentos :: header}"></header>
<main class="container py-4">
    <div th:replace="~{usuario/fragmentos :: titulo}"></div>
    <nav th:replace="~{usuario/fragmentos :: pestanas}"></nav>
    <section th:replace="~{usuario/fragmentos :: mensajes}"></section>
    <div class="perfil-columnas">
        <section th:replace="~{usuario/fragmentos :: datos(false)}"></section>
        <section class="card p-4">
            <h2 th:text="#{credenciales.modificar}"></h2>
            <p th:text="#{credenciales.modificar.ayuda}"></p>
            <form th:action="@{/perfil/guardar}" method="post">
                <label for="correo" th:text="#{credenciales.correo}"></label>
                <input class="form-control" id="correo" name="correo" type="email" th:value="${perfil.correo}" maxlength="254" autocomplete="username" required>
                <label for="actual" th:text="#{credenciales.actual}"></label>
                <input class="form-control" id="actual" name="contrasenaActual" type="password" maxlength="72" autocomplete="current-password" required>
                <label for="nueva" th:text="#{credenciales.nueva}"></label>
                <input class="form-control" id="nueva" name="nuevaContrasena" type="password" minlength="8" maxlength="72" autocomplete="new-password">
                <label for="confirmacion" th:text="#{credenciales.confirmacion}"></label>
                <input class="form-control" id="confirmacion" name="confirmacion" type="password" minlength="8" maxlength="72" autocomplete="new-password">
                <div class="acciones mt-4">
                    <button class="btn btn-primary" th:text="#{credenciales.guardar}"></button>
                    <a class="btn btn-outline-secondary" th:href="@{/perfil}" th:text="#{credenciales.cancelar}"></a>
                </div>
            </form>
        </section>
    </div>
</main>
<footer th:replace="~{general/fragmentos :: footer}"></footer>
</body>
</html>
