<!DOCTYPE html>
<html lang="es" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head th:replace="~{general/fragmentos :: head}"></head>
<body>
<header th:replace="~{general/fragmentos :: header}"></header>
<main class="container py-4">
    <h1 th:text="#{carrito.catalogo}"></h1>
    <p th:if="${variantes.empty}" th:text="#{carrito.catalogo.vacio}"></p>
    <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-3">
        <article class="col" th:each="variante : ${variantes}" th:with="prenda=${variante.prenda}">
            <div class="card h-100 catalogo-prenda">
                <div class="catalogo-imagen">
                    <img th:if="${!#strings.isEmpty(prenda.rutaImagen)}"
                         th:src="@{${prenda.rutaImagen}}" th:alt="${prenda.nombre}" loading="lazy">
                    <i th:if="${#strings.isEmpty(prenda.rutaImagen)}" class="fa-solid fa-shirt" aria-hidden="true"></i>
                </div>
                <div class="card-body d-flex flex-column">
                    <h2 class="h5" th:text="${prenda.nombre}"></h2>
                    <p class="small" th:text="${prenda.descripcion}"></p>
                    <div class="catalogo-datos mt-auto mb-3">
                        <span><span th:text="#{carrito.talla}"></span> <strong th:text="${variante.talla}"></strong></span>
                        <strong th:text="${prenda.precio}"></strong>
                    </div>
                    <p class="mb-0" th:if="${variante.cantidad == 0}" th:text="#{carrito.agotado}"></p>
                    <div th:if="${variante.cantidad > 0}">
                        <form sec:authorize="hasAnyRole('ANONYMOUS', 'CLIENTE')" method="post"
                              th:action="@{/carrito/agregar/{id}(id=${prenda.idPrenda})}">
                            <input type="hidden" name="talla" th:value="${variante.talla}">
                            <button class="btn btn-primary btn-sm" type="submit" th:text="#{carrito.agregar}"></button>
                        </form>
                    </div>
                </div>
            </div>
        </article>
    </div>
</main>
<footer th:replace="~{general/fragmentos :: footer}"></footer>
</body>
</html>
