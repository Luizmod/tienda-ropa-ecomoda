<!DOCTYPE html>
<html lang="es" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"></head>
<body>
<header th:replace="~{general/fragmentos :: header}"></header>
<main class="container py-4">
    <h1 th:text="${revisandoCompra} ? #{carrito.revisarCompra} : #{carrito.titulo}"></h1>
    <section th:replace="~{carrito/fragmentos :: mensajes}"></section>
    <p th:if="${lineas.empty}" th:text="#{carrito.no_mostrar}"></p>
    <section th:unless="${lineas.empty}" class="carrito-columnas mb-3">
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                    <tr>
                        <th scope="col" th:text="#{carrito.datos}"></th>
                        <th scope="col" th:text="#{carrito.talla}"></th>
                        <th scope="col" th:text="#{producto.precio}"></th>
                        <th scope="col" th:text="#{carrito.cantidad}"></th>
                        <th scope="col" th:text="#{carrito.subtotal}"></th>
                        <th scope="col"><span class="visually-hidden" th:text="#{carrito.editar}"></span></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="linea : ${lineas}">
                        <td>
                            <img th:if="${!#strings.isEmpty(linea.rutaImagen)}" th:src="@{${linea.rutaImagen}}"
                                 th:alt="${linea.nombre}" width="72" loading="lazy">
                            <strong th:text="${linea.nombre}"></strong>
                            <div><span th:text="#{carrito.idPrenda}"></span> <span th:text="${linea.idPrenda}"></span></div>
                            <div th:text="${linea.descripcion}"></div>
                        </td>
                        <td th:text="${linea.talla}"></td>
                        <td th:text="${linea.precio}"></td>
                        <td>
                            <span th:text="${linea.cantidad}"></span>
                            <small class="d-block text-danger" th:if="${linea.cantidad > linea.disponibles}"
                                   th:text="#{carrito.stock.insuficiente}"></small>
                        </td>
                        <td th:text="${linea.subtotal}"></td>
                        <td>
                            <a class="btn btn-outline-primary btn-sm"
                               th:href="@{/carrito/modifica/{id}(id=${linea.idLinea})}" th:text="#{carrito.editar}"></a>
                            <a class="btn btn-outline-danger btn-sm"
                               th:href="@{/carrito/eliminar/{id}(id=${linea.idLinea})}" th:text="#{accion.eliminar}"></a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <aside class="card carrito-resumen p-3">
            <h2 class="h4 mb-3" th:text="#{carrito.resumen}"></h2>
            <div th:if="${cuponesAsignados != null}" class="mb-3">
                <form method="post" th:action="@{/carrito/cupon/aplicar}" class="d-flex flex-wrap align-items-end gap-2">
                    <div>
                        <label for="codigo-cupon" class="form-label" th:text="#{carrito.cupon.codigo}"></label>
                        <input id="codigo-cupon" name="codigo" class="form-control" maxlength="40" required>
                    </div>
                    <button type="submit" class="btn btn-outline-primary" th:text="#{carrito.cupon.aplicar}"></button>
                </form>
                <div th:unless="${cuponesAsignados.empty}" class="mt-2">
                    <p class="mb-1" th:text="#{carrito.cupon.asignados}"></p>
                    <form th:each="cupon : ${cuponesAsignados}" method="post" th:action="@{/carrito/cupon/aplicar}"
                          class="d-inline-block me-1">
                        <button type="submit" name="codigo" th:value="${cupon.codigo}" class="btn btn-outline-secondary btn-sm"
                                th:text="|${cupon.codigo} · ${cupon.porcentaje.stripTrailingZeros().toPlainString()} %|"></button>
                    </form>
                </div>
            </div>
            <a th:if="${cuponesAsignados == null}" th:href="@{/carrito/cupon}" th:text="#{carrito.cupon.ingresar}"></a>
            <div th:if="${cuponAplicado != null}" class="text-end">
                <p class="mb-1">
                    <span th:text="#{carrito.subtotal}"></span> <span th:text="${subtotal}"></span>
                </p>
                <p class="mb-1">
                    <span th:text="#{carrito.cupon.descuento(${cuponAplicado.codigo})}"></span>
                    <span th:text="|−${descuento}|"></span>
                </p>
                <form method="post" th:action="@{/carrito/cupon/quitar}">
                    <button type="submit" class="btn btn-link btn-sm" th:text="#{carrito.cupon.quitar}"></button>
                </form>
            </div>
            <p class="fw-bold text-end">
                <span th:text="#{carrito.totalCompra}"></span>
                <span th:text="${total}"></span>
            </p>
            <p th:if="${revisandoCompra}" th:text="#{carrito.compra.pendiente}"></p>
            <a th:unless="${revisandoCompra}" class="btn btn-primary"
               th:href="@{/carrito/compra}" th:text="#{carrito.continuarCompra}"></a>
        </aside>
    </section>
    <a th:if="${revisandoCompra}" class="btn btn-outline-secondary"
       th:href="@{/carrito/listado}" th:text="#{carrito.verCarrito}"></a>
    <a class="btn btn-outline-primary" th:href="@{/catalogo/listado}" th:text="#{carrito.seguirComprando}"></a>
</main>
<footer th:replace="~{general/fragmentos :: footer}"></footer>
</body>
</html>
