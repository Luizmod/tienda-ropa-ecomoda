<!DOCTYPE html>
<html lang="es" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"></head>
<body>
<header th:replace="~{general/fragmentos :: header}"></header>
<main class="container py-4">
    <div class="col-lg-7">
        <h1 th:text="${promocion.idPromocion == null} ? #{promocion.nueva} : #{promocion.editar}"></h1>
        <section th:replace="~{general/gestion :: mensajes}"></section>
        <form method="post" th:object="${promocion}" th:action="@{/promocion/guardar}">
            <div th:replace="~{promociones/fragmentos :: campos}"></div>
            <button class="btn btn-primary" type="submit" th:text="#{accion.guardar}"></button>
            <a class="btn btn-outline-secondary" th:href="@{/promocion/listado}" th:text="#{credenciales.cancelar}"></a>
        </form>
    </div>
</main>
<footer th:replace="~{general/fragmentos :: footer}"></footer>
</body>
</html>
