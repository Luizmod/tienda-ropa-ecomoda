<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Promocion - Administrador</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f7f4ee; margin: 0; display: flex; }
        .sidebar { width: 220px; background-color: #2b2825; color: #fff; min-height: 100vh; padding: 25px 20px; box-sizing: border-box; }
        .sidebar .brand { font-family: 'Georgia', 'Garamond', 'Times New Roman', serif; font-size: 1.6rem; font-weight: normal; margin-bottom: 5px; }
        .sidebar .sub-title { font-size: 0.7rem; color: #9c958f; letter-spacing: 1px; margin-bottom: 35px; }
        .sidebar a { display: block; color: #c2bbb3; text-decoration: none; padding: 10px 0; font-size: 0.95rem; }
        .sidebar a.active { color: #2b2825; background: #d9cfc1; padding: 8px 12px; border-radius: 8px; font-weight: 600; }
        .main-content { flex: 1; padding: 40px; box-sizing: border-box; }
        .top-path { font-size: 0.75rem; color: #777; text-transform: uppercase; margin-bottom: 20px; }
        h1 { margin: 0 0 5px 0; font-size: 2rem; font-weight: normal; color: #222; }
        .subtitle { color: #666; margin: 0 0 30px 0; font-size: 0.95rem; }
        .form-card { background: #fff; border: 1px solid #e0d7cd; border-radius: 12px; padding: 30px; max-width: 600px; box-sizing: border-box; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.8rem; color: #666; margin-bottom: 6px; text-transform: uppercase; }
        .form-group input, .form-group textarea { width: 100%; border: 1px solid #d5ccc0; border-radius: 8px; padding: 12px; box-sizing: border-box; outline: none; font-size: 0.9rem; }
        .btn-black { background-color: #222; color: #fff; border: none; padding: 12px 22px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; }
        .btn-cancel { border: 1px solid #d5ccc0; background: transparent; padding: 12px 22px; border-radius: 8px; cursor: pointer; color: #333; text-decoration: none; display: inline-block; margin-left: 10px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="brand">Ecomoda</div>
        <div class="sub-title">ADMINISTRACIÓN</div>
        <a th:href="@{/}">Panel</a>
        <a href="@{/prenda/listado}">Prendas</a>
        <a th:href="@{/categoria/listado}">Categorias</a>
        <a href="@{/inventario/listado}">Inventario</a>
        <a href="@{/pedido/listado}">Pedidos</a>
        <a href="@{/cupon/listado}">Cupones</a>
        <a th:href="@{/promocion/listado}" class="active">Promociones</a>
    </div>
    <div class="main-content">
        <h1>Detalle de promoción</h1>
        <p class="subtitle">Actualiza o registra los datos de la promoción</p>

        <div class="form-card">
            <form th:action="@{/promocion/guardar}" th:object="${promocion}" method="POST">
                <input type="hidden" th:field="*{idPromocion}" />

                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" th:field="*{nombre}" placeholder="Nombre de la promoción" required="required" />
                </div>
                <div class="form-group">
                    <label>Descripción</label>
                    <textarea th:field="*{descripcion}" rows="3" placeholder="Descripción breve" required="required"></textarea>
                </div>
                <div class="form-group">
                    <label>Porcentaje (%)</label>
                    <input type="number" step="0.01" th:field="*{porcentaje}" placeholder="Ej: 20.00" required="required" />
                </div>
                <div class="form-group">
                    <label>Fecha de Inicio</label>
                    <input type="date" th:field="*{fechaInicio}" required="required" />
                </div>
                <div class="form-group">
                    <label>Fecha de Fin</label>
                    <input type="date" th:field="*{fechaFin}" required="required" />
                </div>
                
                <button type="submit" class="btn-black">Guardar</button>
                <a th:href="@{/promocion/listado}" class="btn-cancel">Cancelar</a>
            </form>
        </div>
    </div>
</body>
</html>
