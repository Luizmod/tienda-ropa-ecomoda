<!DOCTYPE html>
<html lang="es" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{general/fragmentos :: head}"></head>
<body>
<header th:replace="~{general/fragmentos :: header}"></header>
<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 th:text="#{promocion.destacadas}"></h1>
        <a sec:authorize="hasRole('ADMIN')" class="btn btn-primary"
           th:href="@{/promocion/nuevo}" th:text="#{promocion.nueva}"></a>
    </div>
    <section th:replace="~{general/gestion :: mensajes}"></section>
    <p th:if="${promociones.empty}" th:text="#{promocion.vacio}"></p>
    <div class="table-responsive" th:unless="${promociones.empty}">
        <table class="table align-middle">
            <thead>
                <tr>
                    <th scope="col" th:text="#{promocion.nombre}"></th>
                    <th scope="col" th:text="#{promocion.descripcion}"></th>
                    <th scope="col" th:text="#{promocion.descuento}"></th>
                    <th scope="col" th:text="#{promocion.vigencia}"></th>
                    <th sec:authorize="hasRole('ADMIN')" scope="col" th:text="#{accion.acciones}"></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="promocion : ${promociones}">
                    <th scope="row" th:text="${promocion.nombre}"></th>
                    <td th:text="${promocion.descripcion}"></td>
                    <td th:text="${promocion.descuentoFormateado}"></td>
                    <td th:text="${promocion.vigenciaFormateada}"></td>
                    <td sec:authorize="hasRole('ADMIN')">
                        <div th:replace="~{general/gestion :: acciones(
                                @{/promocion/modificar/{id}(id=${promocion.idPromocion})},
                                @{/promocion/eliminar/{id}(id=${promocion.idPromocion})},
                                #{promocion.confirmarBorrado})}"></div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{general/fragmentos :: footer}"></footer>
</body>
</html>
