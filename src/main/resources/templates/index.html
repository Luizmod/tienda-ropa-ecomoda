<!DOCTYPE html>
<html lang="es" th:lang="${#locale.toLanguageTag()}" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

    <!-- Reemplaza este <head> por el fragmento "head" (CSS, meta, título, etc.) -->
    <head th:replace="~{general/fragmentos :: head}"></head>

    <body>
        <!-- Encabezado/menú común a todas las páginas -->
        <header th:replace="~{general/fragmentos :: header}"></header>

        <main class="container py-4">
            <section class="portada">
                <div class="portada-texto">
                    <h1 th:text="#{index.portada}"></h1>
                    <p th:text="#{index.lema}"></p>
                    <a class="btn btn-beige" th:href="@{/catalogo/listado}" th:text="#{index.verCatalogo}"></a>
                </div>
                <div class="portada-imagen">
                    <img th:src="@{/img/portada-camisa.jpg}" width="620" height="480" alt="">
                </div>
            </section>
            <section th:if="${promociones != null and !promociones.empty}" class="mt-4">
                <h2 th:text="#{promocion.destacadas}"></h2>
                <div class="row row-cols-1 row-cols-md-2 g-3">
                    <article class="col" th:each="promocion : ${promociones}">
                        <div class="card h-100">
                            <div class="card-body d-flex align-items-center gap-3">
                                <span class="promocion-descuento" th:text="${promocion.descuentoFormateado}"></span>
                                <div>
                                    <h3 class="h6 mb-1" th:text="${promocion.nombre}"></h3>
                                    <p class="small mb-0" th:text="${promocion.descripcion}"></p>
                                </div>
                            </div>
                        </div>
                    </article>
                </div>
            </section>
        </main>

        <!-- Pie de página común -->
        <footer th:replace="~{general/fragmentos :: footer}"></footer>
    </body>
</html>
