<!DOCTYPE html>
<html lang="es" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"></head>
<body>
<header th:replace="~{general/fragmentos :: header}"></header>
<main class="container py-4">
    <div class="col-lg-7">
        <h1 th:text="${id == null} ? #{direccion.nuevo} : #{direccion.editar}"></h1>
        <section th:replace="~{general/gestion :: mensajes}"></section>
        <form method="post" th:object="${formulario}"
              th:action="${id == null} ? @{/direccion/nuevo} : @{/direccion/modificar/{id}(id=${id})}">
            <div th:replace="~{direccion/fragmentos :: campos}"></div>
            <button class="btn btn-primary" type="submit" th:text="#{accion.guardar}"></button>
            <a class="btn btn-outline-secondary" th:href="@{/direccion/listado}" th:text="#{credenciales.cancelar}"></a>
        </form>
    </div>
</main>
<footer th:replace="~{general/fragmentos :: footer}"></footer>
</body>
</html>
