<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"></head>
<body>
<header th:replace="~{general/fragmentos :: header}"></header>
<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 th:text="#{nav.categorias}"></h1>
        <a class="btn btn-primary" th:href="@{/categoria/nuevo}" th:text="#{categoria.agregar}"></a>
    </div>
    <section th:replace="~{general/gestion :: mensajes}"></section>
    <p th:if="${registros.empty}" th:text="#{categoria.vacio}"></p>
    <div class="table-responsive" th:unless="${registros.empty}">
        <table class="table align-middle">
            <thead>
                <tr>
                    <th scope="col" th:text="#{categoria.nombre}"></th>
                    <th scope="col" th:text="#{categoria.descripcion}"></th>
                    <th scope="col" th:text="#{accion.acciones}"></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="categoria : ${registros}">
                    <th scope="row" th:text="${categoria.nombre}"></th>
                    <td th:text="${categoria.descripcion}"></td>
                    <td>
                        <div th:replace="~{general/gestion :: acciones(
                                @{/categoria/modificar/{id}(id=${categoria.idCategoria})},
                                @{/categoria/eliminar/{id}(id=${categoria.idCategoria})}, #{categoria.confirmar})}"></div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{general/fragmentos :: footer}"></footer>
</body>
</html>
