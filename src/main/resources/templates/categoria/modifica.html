<!DOCTYPE html>
<html lang="es" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"></head>
<body>
<header th:replace="~{general/fragmentos :: header}"></header>
<main class="container py-4">
    <div class="col-lg-7">
        <h1 th:text="${categoria.idCategoria == null} ? #{categoria.agregar} : #{categoria.editar}"></h1>
        <section th:replace="~{general/gestion :: mensajes}"></section>
        <form method="post" th:object="${categoria}" th:action="@{/categoria/guardar}">
            <div th:replace="~{categoria/fragmentos :: campos}"></div>
            <button class="btn btn-primary" type="submit" th:text="#{accion.guardar}"></button>
            <a class="btn btn-outline-secondary" th:href="@{/categoria/listado}" th:text="#{credenciales.cancelar}"></a>
        </form>
    </div>
</main>
<footer th:replace="~{general/fragmentos :: footer}"></footer>
</body>
</html>
