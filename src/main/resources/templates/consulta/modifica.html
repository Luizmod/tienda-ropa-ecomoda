<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"></head>
<body>
<header th:replace="~{general/fragmentos :: header}"></header>
<main class="container py-4">
    <div class="col-lg-7">
        <h1 th:text="${formulario.idConsulta == null} ? #{consulta.nueva} : #{consulta.editar}"></h1>
        <section th:replace="~{general/gestion :: mensajes}"></section>
        <form th:replace="~{consulta/fragmentos :: formulario}"></form>
        <a class="btn btn-outline-secondary mt-3" th:href="@{/consulta/listado}" th:text="#{credenciales.cancelar}"></a>
    </div>
</main>
<footer th:replace="~{general/fragmentos :: footer}"></footer>
</body>
</html>
