<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"></head>
<body>
<header th:replace="~{general/fragmentos :: header}"></header>
<main class="container py-4">
    <h1 th:text="#{consulta.misConsultas}"></h1>
    <section th:replace="~{general/gestion :: mensajes}"></section>
    <p th:if="${consultas.empty}" th:text="#{consulta.vacio}"></p>
    <div class="table-responsive" th:unless="${consultas.empty}">
        <table class="table align-middle">
            <thead>
                <tr>
                    <th scope="col" th:text="#{consulta.asunto}"></th>
                    <th scope="col" th:text="#{consulta.mensaje}"></th>
                    <th scope="col" th:text="#{consulta.estado}"></th>
                    <th scope="col" th:text="#{consulta.respuesta}"></th>
                    <th scope="col" th:text="#{accion.acciones}"></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="consulta : ${consultas}">
                    <th scope="row" th:text="${consulta.asunto}"></th>
                    <td class="text-break" th:text="${consulta.mensaje}"></td>
                    <td th:text="${#messages.msg('consulta.estado.' + consulta.estado)}"></td>
                    <td class="text-break" th:text="${consulta.respuesta}"></td>
                    <td>
                        <div th:replace="~{general/gestion :: acciones(
                                @{/consulta/modificar/{id}(id=${consulta.idConsulta})},
                                @{/consulta/eliminar/{id}(id=${consulta.idConsulta})}, #{consulta.confirmarBorrado})}"></div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <section class="col-lg-7 mt-4">
        <h2 th:text="#{consulta.nueva}"></h2>
        <form th:replace="~{consulta/fragmentos :: formulario}"></form>
    </section>
</main>
<footer th:replace="~{general/fragmentos :: footer}"></footer>
</body>
</html>
