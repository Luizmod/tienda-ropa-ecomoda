<!-- Fragmento #1 que irá en el head de todas las páginas, así se incluye todo lo necesario de configuración-->
<head th:fragment="head">
    <title th:text="#{aplicacion.titulo}"></title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" type="image/png" sizes="16x16" href="/fav/favicon-16x16.png"/>
    <link rel="icon" type="image/png" sizes="32x32" href="/fav/favicon-32x32.png"/>
    <link rel="icon" type="image/png" sizes="96x96" href="/fav/favicon-96x96.png"/>
    <link rel="icon" type="image/png" sizes="256x256" href="/fav/favicon-256x256.png"/>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/webjars/font-awesome/css/all.css}" rel="stylesheet"/>
    <link th:href="@{/css/ecomoda.css}" rel="stylesheet"/>
    <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
    <th:block th:replace="~{general/fragmentos :: scriptsMenu}"></th:block>
    <script th:src="@{/js/rutinas.js}"></script>
</head>

<th:block th:fragment="scriptsMenu">
    <script th:src="@{/webjars/popper.js/umd/popper.min.js}"></script>
    <script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
</th:block>

<!-- Fragmento #2  define el encabezado de las páginas, en concreto el menú y enlaces rápidos -->
<header th:fragment="header" class="tienda-cabecera">
    <span class="tienda-admin" sec:authorize="hasRole('ADMIN')" hidden></span>
    <nav class="navbar navbar-expand-lg">
        <div class="container">                    
            <a th:href="@{/}" class="navbar-brand logotipo"><i class="fa-solid fa-leaf" aria-hidden="true"></i> EcoModa</a>
            <button type="button" class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarCollapse"
                    aria-controls="navbarCollapse" aria-expanded="false" th:attr="aria-label=#{nav.menu}">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-between" id="navbarCollapse">
                <ul class="navbar-nav">
                    <li class="nav-item px-2"><a class="nav-link" th:href="@{/}" th:text="#{credenciales.inicio}"></a></li>
                    <li class="nav-item px-2" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:href="@{/categoria/listado}" th:text="#{nav.categorias}"></a></li>
                    <li class="nav-item px-2" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:href="@{/prenda/listado}" th:text="#{nav.prendas}"></a></li>
                    <li class="nav-item px-2"><a class="nav-link" th:href="@{/catalogo/listado}" th:text="#{carrito.catalogo}"></a></li>
                    <li class="nav-item px-2" sec:authorize="hasAnyRole('ANONYMOUS', 'CLIENTE')">
                        <a class="nav-link" th:href="@{/carrito/listado}"><i class="fa-solid fa-cart-shopping me-1" aria-hidden="true"></i> [[#{carrito.verCarrito}]]</a>
                    </li>
                    <li class="nav-item px-2" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:href="@{/admin/consulta/listado}" th:text="#{nav.consultas}"></a></li>
                    <li class="nav-item px-2" sec:authorize="hasRole('CLIENTE')"><a class="nav-link" th:href="@{/consulta/listado}" th:text="#{nav.consultas}"></a></li>
                    <li class="nav-item px-2" sec:authorize="hasRole('CLIENTE')"><a class="nav-link" th:href="@{/direccion/listado}" th:text="#{nav.direcciones}"></a></li>
                    <li class="nav-item px-2" sec:authorize="hasRole('CLIENTE')"><a class="nav-link" th:href="@{/metodopago/listado}" th:text="#{nav.metodosPago}"></a></li>
                    <li class="nav-item px-2"><a class="nav-link" th:href="@{/cupon/listado}" th:text="#{nav.cupones}"></a></li>
                    <li class="nav-item px-2"><a class="nav-link" th:href="@{/promocion/listado}" th:text="#{nav.promociones}"></a></li>
                    <li class="nav-item px-2" sec:authorize="isAnonymous()"><a class="nav-link" th:href="@{/login}" th:text="#{nav.login}"></a></li>
                    <li class="nav-item px-2" sec:authorize="isAnonymous()"><a class="nav-link" th:href="@{/registro/nuevo}" th:text="#{nav.registro}"></a></li>
                    <li class="nav-item px-2" sec:authorize="isAuthenticated()"><a class="nav-link" th:href="@{/perfil}" th:text="#{credenciales.perfil}"></a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown" href="#" role="button" aria-expanded="false">
                            [[#{plantilla.idioma}]]</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" th:href="@{''(lang=es)}">Español</a></li>
                            <li><a class="dropdown-item" th:href="@{''(lang=en)}">English</a></li>
                            <li><a class="dropdown-item" th:href="@{''(lang=fr)}">Français</a></li>
                            <li><a class="dropdown-item" th:href="@{''(lang=pt)}">Português</a></li>
                        </ul>
                    </li>
                </ul>
                <div id="resultBlock">
                </div>         

            </div>
        </div>
    </nav>
</header>

<!-- Fragmento #3  define el footer de las páginas, aparte de esto se podria incluir enlaces a redes socilaes y demás -->
<footer th:fragment="footer" class="tienda-pie">
    <div class="container"><p class="mb-0">&copy; EcoModa</p></div>
</footer>

<!-- Fragmento #4  define la ventana modal para mostrar un Toast -->
<section th:fragment="mostrarToast">
    <div aria-live="polite" aria-atomic="true" 
         class="position-fixed top-50 start-50 translate-middle" style="z-index: 1080;">                
        <div th:if="${error}" class="toast show"
             role="alert"
             aria-live="assertive"                     
             aria-atomic="true"
             data-bs-autohide="true">
            <div class="toast-header text-white bg-danger">
                <i class="fa-solid fa-bomb"></i> <strong clas=me-auto> [[#{error}]]</strong>
            </div>
            <div class="toast-body">
                <p>[[${error}]]</p>
                <div class="mt-2 pt-2 border-top text-center">
                    <button type="button" class="btn btn-secondary btn-sm" 
                            data-bs-dismiss="toast">[[#{accion.cerrar}]]</button>
                </div>
            </div>
        </div>
        <div th:if="${todoOk}" class="toast show"
             role="status"
             aria-live="polite"
             aria-atomic="true"
             data-bs-autohide="true">
            <div class="toast-header text-white bg-success">
                <i class="fa-solid fa-square-check"></i> <strong clas=me-auto> [[#{atencion}]]</strong>
            </div>
            <div class="toast-body">
                <p>[[${todoOk}]]</p>
                <div class="mt-2 pt-2 border-top text-center">
                    <button type="button" class="btn btn-secondary btn-sm" 
                            data-bs-dismiss="toast">[[#{accion.cerrar}]]</button>
                </div>
            </div>
        </div>
    </div>
</section>
